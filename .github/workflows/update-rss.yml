name: Update RSS (root)

on:
  schedule:
    - cron: "*/5 * * * *"    # every 5 minutes
  workflow_dispatch:         # allow manual run

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate crdg_forecast.xml at repo root
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const pad2=n=>n<10?"0"+n:String(n);
          const secsToHMS=sec=>{sec=Math.max(0,Math.floor(sec));const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return `${pad2(h)}:${pad2(m)}:${pad2(s)}`;}
          const escapeXML=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
          const safeNum=(x,f=0)=>Number.isFinite(x)?x:f;

          // Perlin
          const P=[151,160,137,91,90,15,131,13,201,95,96,53,194,233,7,225,140,36,103,30,69,142,8,99,37,240,21,10,23,190,6,148,247,120,234,75,0,26,197,62,94,252,219,203,117,35,11,32,57,177,33,88,237,149,56,87,174,20,125,136,171,168,68,175,74,165,71,134,139,48,27,166,77,146,158,231,83,111,229,122,60,211,133,230,220,105,92,41,55,46,245,40,244,102,143,54,65,25,63,161,1,216,80,73,209,76,132,187,208,89,18,169,200,196,135,130,116,188,159,86,164,100,109,198,173,186,3,64,52,217,226,250,124,123,5,202,38,147,118,126,255,82,85,212,207,206,59,227,47,16,58,17,182,189,28,42,223,183,170,213,119,248,152,2,44,154,163,70,221,153,101,155,167,43,172,9,129,22,39,253,19,98,108,110,79,113,224,232,178,185,112,104,218,246,97,228,251,34,242,193,238,210,144,12,191,179,162,241,81,51,145,235,249,14,239,107,49,192,214,31,181,199,106,157,184,84,204,176,115,121,50,45,127,4,150,254,138,236,205,93,222,114,67,29,24,72,243,141,128,195,78,66,215,61,156,180];
          const perm=new Array(512);for(let i=0;i<512;i++)perm[i]=P[i&255];
          const fade=t=>t*t*t*(t*(t*6-15)+10),lerp=(a,b,t)=>a+t*(b-a);
          const grad=(h,x,y,z)=>((h<8?x:y)*(h&1?-1:1))+(((h<4?y:(h===12||h===14?x:z)))*(h&2?-1:1));
          const noise=(x,y=0,z=0)=>{
            let X=Math.floor(x)&255,Y=Math.floor(y)&255,Z=Math.floor(z)&255;
            x-=Math.floor(x);y-=Math.floor(y);z-=Math.floor(z);
            const u=fade(x),v=fade(y),w=fade(z);
            const A=(perm[X]+Y)&255,AA=(perm[A]+Z)&255,AB=(perm[A+1]+Z)&255,B=(perm[X+1]+Y)&255,BA=(perm[B]+Z)&255,BB=(perm[B+1]+Z)&255;
            const gAA=grad(perm[AA],x,y,z),gBA=grad(perm[BA],x-1,y,z),gAB=grad(perm[AB],x,y-1,z),gBB=grad(perm[BB],x-1,y-1,z),
                  gAA1=grad(perm[AA+1],x,y,z-1),gBA1=grad(perm[BA+1],x-1,y,z-1),gAB1=grad(perm[AB+1],x,y-1,z-1),gBB1=grad(perm[BB+1],x-1,y-1,z-1);
            const x1=lerp(gAA,gBA,u),x2=lerp(gAB,gBB,u),y1=lerp(x1,x2,v),x3=lerp(gAA1,gBA1,u),x4=lerp(gAB1,gBB1,u),y2=lerp(x3,x4,v);
            return lerp(y1,y2,w);
          };

          // Weather model & helpers
          const epochOffsetSeconds=Math.floor(Date.now()/1000)-performance.now()/1000;
          const sampleWeather=(off=0)=>{const t=performance.now()/1000+epochOffsetSeconds+off-1753269629;
            const intensity=noise(t*2e-4)+.5, humidity=Math.pow(noise(t*2e-4,123.4567)+.5,1.5), wind_direction=noise(t*2e-5,525.2525)*Math.PI*2;
            let weather="Clear"; if(intensity<.3&&humidity<.5)weather="Clear"; else if((intensity<.3||humidity<.65)&&humidity>=.5)weather="Cloudy";
            else if(((intensity>.3&&intensity<.7)||humidity<.7)&&humidity>=.65)weather="Overcast"; else if(intensity>=.7&&humidity>=.7)weather="Stormy";
            return {intensity,humidity,wind_direction,weather,t};};
          const losAngelesNow=()=>new Date(new Date().toLocaleString("en-US",{timeZone:"America/Los_Angeles"}));
          const laPlus=(sec)=>new Date(losAngelesNow().getTime()+sec*1000);
          const inTransitionWindow=(d)=>{const h=d.getHours(),m=d.getMinutes();return (h===4&&m>=10)||(h===5&&m<=50)||(h===16&&m>=10)||(h===17&&m<=50);};
          const secondsUntilNextBoundary=(d)=>{const s=d.getHours()*3600+d.getMinutes()*60+d.getSeconds();let target;
            if(inTransitionWindow(d))target=(d.getHours()<12)?21000:64200; else if(d.getHours()<16||(d.getHours()>=0&&d.getHours()<4))target=(d.getHours()<4)?15000:58200; else target=101400;
            let delta=target-s; if(delta<0)delta+=86400; return delta;};
          const safe=(x,f=0)=>Number.isFinite(x)?x:f;
          const tempFAt=(off=0)=>{const la=laPlus(off);const hour=la.getHours()+la.getMinutes()/60;const {intensity,humidity}=sampleWeather(off);
            const diurnal=Math.sin((hour-15)/24*2*Math.PI);const T=72+10*diurnal+10*(safe(intensity)-0.5)-6*(safe(humidity)-0.5);return Math.round(T*10)/10;};
          const baroInHg=(off=0)=>{const {intensity,humidity,weather}=sampleWeather(off);let p=29.92-0.8*(safe(intensity)-0.5)-0.6*(safe(humidity)-0.5);
            if(weather==="Stormy")p-=0.3; if(weather==="Overcast")p-=0.1; if(weather==="Clear")p+=0.1; return Math.round(p*100)/100;};
          const baroCondition=p=>p<29.5?"Falling rapidly":p<29.8?"Falling":p<30.0?"Steady":p<30.2?"Rising":"Rising rapidly";
          const laSecondsSinceMidnight=()=>{const d=losAngelesNow();return d.getHours()*3600+d.getMinutes()*60+d.getSeconds();};
          const dayStatsByDayIndex=(i)=>{const sod=laSecondsSinceMidnight();const start=-sod+i*86400;
            let tMax=-1e9,tMin=1e9;const cnts={Clear:0,Cloudy:0,Overcast:0,Stormy:0};
            for(let h=0;h<24;h++){const o=start+h*3600,T=tempFAt(o),w=sampleWeather(o).weather;tMax=Math.max(tMax,T);tMin=Math.min(tMin,T);cnts[w]=(cnts[w]||0)+1;}
            const order=["Stormy","Overcast","Cloudy","Clear"];let mode="Clear",best=-1;for(const k of order){const c=cnts[k]||0;if(c>best){best=c;mode=k;}}return{high:tMax,low:tMin,condition:mode};};
          const generate7DayForecastTextInternal=()=>{const sod=laSecondsSinceMidnight();let out="NOW YOUR 7-DAY FORECAST...\n";
            for(let i=0;i<7;i++){const dayMid=-sod+i*86400;const dayName=laPlus(dayMid).toLocaleDateString("en-US",{weekday:"long"});
              const {high,low,condition}=dayStatsByDayIndex(i);const baro=baroInHg(i*86400);
              out+=`${dayName}: ${condition}. High near ${Math.round(high)}°F, Low around ${Math.round(low)}°F. Pressure ${baro} inHg (${baroCondition(baro)}).\n`; }
            return out.trim();};
          const findNextStormWindow=()=>{let start=null,end=null;for(let s=0;s<172800;s++){ if(sampleWeather(s).weather==="Stormy"){ start=s; break; } }
            if(start===null) return null; end=start; for(let s=start;s<172800;s++){ if(sampleWeather(s).weather!=="Stormy"){ end=s; break; } } return {startIn:start,duration:end-start};};

          const nowW=sampleWeather(0), la=losAngelesNow(), inWin=inTransitionWindow(la), until=secondsUntilNextBoundary(la), storm=findNextStormWindow();
          const sevenDay=generate7DayForecastTextInternal();
          let storms;
          if(storm){
            const startPST=laPlus(storm.startIn).toLocaleTimeString("en-US",{timeZone:"America/Los_Angeles",hour:"numeric",minute:"2-digit",second:"2-digit",hour12:true});
            const endPST=laPlus(storm.startIn+storm.duration).toLocaleTimeString("en-US",{timeZone:"America/Los_Angeles",hour:"numeric",minute:"2-digit",second:"2-digit",hour12:true});
            storms=`STORM TIMES...\nNext storm: ${startPST} – ${endPST} PST.`;
          } else {
            storms=`STORM TIMES...\nNo significant storms expected within 48 hours.`;
          }
          const blimpTxt=`BLIMP OPERATION TIMES...\nMorning window: 04:10–05:50\nEvening window: 16:10–17:50\nStatus: ${inWin?"WITHIN WINDOW":"OUT OF WINDOW"}\nTime to next boundary: ${secsToHMS(until)}.`;
          const baroNow=baroInHg(0), baroTxt=`Barometer: ${baroNow} inHg (${baroCondition(baroNow)})`;
          const description=[sevenDay,storms,blimpTxt,"OBSERVATIONS FROM AROUND THE AREA:\n(no observations reported)",baroTxt,
            `Report generated at ${new Date().toLocaleString("en-US",{timeZone:"America/Los_Angeles"})} (PST/PDT).`].join("\n\n");
          const title=`Forecast Update – ${nowW.weather} – ${new Date().toLocaleTimeString("en-US",{timeZone:"America/Los_Angeles"})}`;

          const itemsXML=`    <item>
              <title>${escapeXML(title)}</title>
              <link>https://${process.env.GITHUB_REPOSITORY_OWNER}.github.io/</link>
              <description><![CDATA[${description}]]></description>
              <category>Weather Forecast</category>
              <pubDate>${new Date().toUTCString()}</pubDate>
              <guid isPermaLink="false">crdg-${Date.now()}</guid>
            </item>`;

          const xml=`<?xml version="1.0" encoding="UTF-8"?>
          <rss version="2.0">
            <channel>
              <title>CRDG Weather Service Forecast</title>
              <link>https://${process.env.GITHUB_REPOSITORY_OWNER}.github.io/</link>
              <description>Automated simulated CRDG forecast feed (NWS bulletin style).</description>
              <language>en-us</language>
              <generator>CRDG Automated Forecast Unit</generator>
              <ttl>5</ttl>
          ${itemsXML}
            </channel>
          </rss>`;

          fs.writeFileSync("crdg_forecast.xml",""+xml,"utf8");
          console.log("WROTE crdg_forecast.xml, length:", xml.length);
          NODE

      - name: List repo root (debug)
        run: ls -la

      - name: Commit & push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update crdg_forecast.xml"
          file_pattern: crdg_forecast.xml
