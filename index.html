<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>reed timer</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #111111;
      overflow: hidden;
    }

    .timer-card {
      width: 100vw;
      height: 320px;
      position: fixed;
      top: 0;
      left: 0;
      padding: 16px;
      background: #f5f5f5;
      border: 2px solid #333333;
      border-radius: 0;
      box-shadow: none;
      text-align: left;
      overflow: hidden;
    }

    .label {
      margin: 0;
      padding-bottom: 8px;
      border-bottom: 1px solid #777777;
      font-size: 15px;
      font-weight: 700;
      color: #111111;
    }

    .content-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding-top: 14px;
    }

    .main-content {
      flex: 1 1 auto;
      min-width: 0;
    }

    .countdown {
      margin: 0 0 14px 0;
      font-size: clamp(38px, 7vw, 56px);
      line-height: 1.15;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      color: #000000;
      white-space: nowrap;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 10px;
      padding: 4px 0;
      font-size: 15px;
      font-weight: 700;
      color: #111111;
      background: transparent;
    }

    .dot {
      width: 10px;
      height: 10px;
      display: inline-block;
      background: #777777;
    }

    .active .status {
      color: #005500;
    }

    .active .dot {
      background: #008000;
    }

    .waiting .status {
      color: #8a5a00;
    }

    .waiting .dot {
      background: #b36b00;
    }

    .window-info,
    .local-info {
      margin: 5px 0;
      font-size: 14px;
      line-height: 1.3;
      color: #222222;
    }

    .schedule {
      flex: 0 0 280px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
      margin: 0;
      font-size: 14px;
      color: #111111;
    }

    .slot {
      padding: 11px 12px;
      background: #ffffff;
      border: 1px solid #999999;
      font-variant-numeric: tabular-nums;
      min-height: 54px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      gap: 3px;
    }

    .slot-label {
      font-size: 12px;
      font-weight: 700;
      color: #444444;
    }

    .slot-time {
      font-size: 14px;
      color: #111111;
    }

    .slot.current {
      background: #dcdcdc;
      border-color: #333333;
      font-weight: 700;
    }

    @media (max-width: 560px) {
      .content-row {
        display: block;
      }

      .countdown {
        font-size: 36px;
      }

      .schedule {
        width: 100%;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 10px;
      }
    }
  </style>
</head>
<body>
  <main class="timer-card waiting" id="card">
    <div class="label" id="label">The next blimp arrives in...</div>

    <div class="content-row">
      <div class="main-content">
        <div class="countdown" id="countdown">0h 00m 00s</div>
        <div class="status" id="status"><span class="dot"></span><span id="statusText">Waiting</span></div>
        <div class="window-info" id="windowInfo">Loading...</div>
        <div class="local-info" id="estTime">Current time: --:--:--</div>
      </div>

      <section class="schedule" id="schedule"></section>
    </div>
  </main>

  <script>
    // IANA time zone names automatically account for daylight saving time.
    const SCHEDULE_TIME_ZONE = "America/New_York";

    const WINDOWS = [
      { label: "Blimp 1", start: "02:00", end: "02:45" },
      { label: "Blimp 2", start: "07:10", end: "08:45" },
      { label: "Blimp 3", start: "14:00", end: "14:14" },
      { label: "Blimp 4", start: "19:10", end: "20:45" }
    ];

    const card = document.getElementById("card");
    const label = document.getElementById("label");
    const countdown = document.getElementById("countdown");
    const statusText = document.getElementById("statusText");
    const windowInfo = document.getElementById("windowInfo");
    const estTime = document.getElementById("estTime");
    const schedule = document.getElementById("schedule");

    const zonePartsFormatter = new Intl.DateTimeFormat("en-US", {
      timeZone: SCHEDULE_TIME_ZONE,
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hourCycle: "h23",
      timeZoneName: "short"
    });

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function timeToMinutes(time) {
      const parts = time.split(":");
      return Number(parts[0]) * 60 + Number(parts[1]);
    }

    function formatDuration(milliseconds) {
      const totalSeconds = Math.max(0, Math.floor(milliseconds / 1000));
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      return pad(hours) + "h " + pad(minutes) + "m " + pad(seconds) + "s";
    }

    function getZoneParts(date) {
      const parts = zonePartsFormatter.formatToParts(date);
      const values = {};

      for (const part of parts) {
        if (part.type !== "literal") values[part.type] = part.value;
      }

      return {
        year: Number(values.year),
        month: Number(values.month),
        day: Number(values.day),
        hour: Number(values.hour),
        minute: Number(values.minute),
        second: Number(values.second),
        timeZoneName: values.timeZoneName,
        minuteOfDay: Number(values.hour) * 60 + Number(values.minute)
      };
    }

    function getTimeZoneOffsetMs(date) {
      const parts = getZoneParts(date);
      const representedAsUtc = Date.UTC(
        parts.year,
        parts.month - 1,
        parts.day,
        parts.hour,
        parts.minute,
        parts.second
      );
      return representedAsUtc - date.getTime();
    }

    // Converts a wall-clock time in SCHEDULE_TIME_ZONE to a real UTC timestamp.
    // Recalculating the offset handles EST/EDT automatically on DST boundaries.
    function zonedTimeToMilliseconds(zoneParts, minuteOfDay, dayOffset) {
      const baseDate = new Date(Date.UTC(
        zoneParts.year,
        zoneParts.month - 1,
        zoneParts.day + dayOffset,
        12,
        0,
        0
      ));

      const targetYear = baseDate.getUTCFullYear();
      const targetMonth = baseDate.getUTCMonth();
      const targetDay = baseDate.getUTCDate();
      const hour = Math.floor(minuteOfDay / 60);
      const minute = minuteOfDay % 60;
      const wallClockAsUtc = Date.UTC(targetYear, targetMonth, targetDay, hour, minute, 0, 0);

      let guess = new Date(wallClockAsUtc);
      for (let i = 0; i < 3; i++) {
        guess = new Date(wallClockAsUtc - getTimeZoneOffsetMs(guess));
      }

      return guess.getTime();
    }

    function formatLocalTime(ms) {
      return new Intl.DateTimeFormat(undefined, {
        hour: "2-digit",
        minute: "2-digit"
      }).format(new Date(ms));
    }

    function getLocalWindowLabel(win, zoneNow, dayOffset = 0) {
      const startMinutes = timeToMinutes(win.start);
      const endMinutes = timeToMinutes(win.end);
      const startMs = zonedTimeToMilliseconds(zoneNow, startMinutes, dayOffset);
      const endMs = zonedTimeToMilliseconds(zoneNow, endMinutes, dayOffset);
      return formatLocalTime(startMs) + " - " + formatLocalTime(endMs);
    }

    function renderSchedule(activeIndex, zoneNow) {
      let html = "";

      for (let i = 0; i < WINDOWS.length; i++) {
        const activeClass = i === activeIndex ? " current" : "";
        const localInterval = getLocalWindowLabel(WINDOWS[i], zoneNow);
        html += '<div class="slot' + activeClass + '"><div class="slot-label">' + WINDOWS[i].label + '</div><div class="slot-time">' + localInterval + '</div></div>';
      }

      schedule.innerHTML = html;
    }

    function updateTimer() {
      const now = new Date();
      const zoneNow = getZoneParts(now);
      const nowMinutes = zoneNow.minuteOfDay;
      const nowMs = now.getTime();

      let activeIndex = -1;
      let targetMs = 0;

      for (let i = 0; i < WINDOWS.length; i++) {
        const startMinutes = timeToMinutes(WINDOWS[i].start);
        const endMinutes = timeToMinutes(WINDOWS[i].end);

        if (nowMinutes >= startMinutes && nowMinutes < endMinutes) {
          activeIndex = i;
          targetMs = zonedTimeToMilliseconds(zoneNow, endMinutes, 0);
          break;
        }
      }

      if (activeIndex >= 0) {
        const current = WINDOWS[activeIndex];
        card.className = "timer-card active";
        label.textContent = "Time until this window ends";
        countdown.textContent = formatDuration(targetMs - nowMs);
        statusText.textContent = "Active";
        windowInfo.textContent = "Current window: " + getLocalWindowLabel(current, zoneNow);
        renderSchedule(activeIndex, zoneNow);
      } else {
        let nextIndex = 0;
        let dayOffset = 1;

        for (let i = 0; i < WINDOWS.length; i++) {
          const startMinutes = timeToMinutes(WINDOWS[i].start);

          if (startMinutes > nowMinutes) {
            nextIndex = i;
            dayOffset = 0;
            break;
          }
        }

        const next = WINDOWS[nextIndex];
        const nextStartMinutes = timeToMinutes(next.start);
        targetMs = zonedTimeToMilliseconds(zoneNow, nextStartMinutes, dayOffset);

        card.className = "timer-card waiting";
        label.textContent = "The next blimp arrives in...";
        countdown.textContent = formatDuration(targetMs - nowMs);
        statusText.textContent = "Waiting";
        windowInfo.textContent = "Next window: " + getLocalWindowLabel(next, zoneNow, dayOffset);
        renderSchedule(nextIndex, zoneNow);
      }

      estTime.textContent = "Current Time (" + zoneNow.timeZoneName + "): " +
        pad(zoneNow.hour) + ":" + pad(zoneNow.minute) + ":" + pad(zoneNow.second);
    }

    updateTimer();
    setInterval(updateTimer, 1000);
  </script>
</body>
</html>
