    return {
      date: localDateKey(date),
      day: formatForecastDay(date, today),
      weekday: date.toLocaleDateString(undefined, { weekday: "long" }),
      dayOffset,
      condition: classifyForecastDay(0, dayStartSeconds, random),
      intensity: averageIntensity(0, dayStartSeconds),
      humidity: averageHumidity(0, dayStartSeconds)
    };
  }

  function generateWeeklyForecast(
    now = new Date(),
    random = Math.random
  ) {
    const today = startOfLocalDay(now);
    const forecast = [];
    // daylight time shit
    for (let dayOffset = 0; dayOffset < 7; dayOffset += 1) {
      forecast.push(
        forecastForLocalDate(addLocalDays(today, dayOffset), today, random)
      );
    }

    const overcastIndexes = forecast
      .map((entry, index) => entry.condition === "Overcast" ? index : -1)
      .filter((index) => index !== -1);

    if (overcastIndexes.length >= 4) {
      const selectedIndex =
        overcastIndexes[Math.floor(random() * overcastIndexes.length)];
      forecast[selectedIndex].condition =
        random() < 0.5 ? "Partially Cloudy" : "Rainy";
    }

    return forecast;
  }

  function serializeForecast(forecast, now = new Date()) {
    return JSON.stringify({
      version: CACHE_VERSION,
      anchorDate: localDateKey(startOfLocalDay(now)),
      entries: forecast.map((entry) => ({
        date: entry.date,
        condition: entry.condition
      }))
    });
  }

  function parseForecast(serialized, now = new Date()) {
    if (!serialized || !serialized.trim()) {
      return null;
    }

    let payload;

    try {
      payload = JSON.parse(serialized);
    } catch (_error) {
      return null;
    }

    const today = startOfLocalDay(now);
    const expectedAnchor = localDateKey(today);

    if (
      !payload ||
      payload.version !== CACHE_VERSION ||
      payload.anchorDate !== expectedAnchor ||
      !Array.isArray(payload.entries)
    ) {
      return null;
    }

    const conditionByDate = new Map(
      payload.entries.map((entry) => [entry.date, entry.condition])
    );

    const forecast = [];

    for (let dayOffset = 0; dayOffset < 7; dayOffset += 1) {
      const date = addLocalDays(today, dayOffset);
      const dateKey = localDateKey(date);
      const condition = conditionByDate.get(dateKey);

      if (!condition) {
        return null;
      }

      const entry = forecastForLocalDate(date, today, Math.random);
      entry.condition = condition;
      forecast.push(entry);
    }

    return forecast;
  }

  function clearForecastCache(storage) {
    if (!storage) {
      return;
    }

    storage.removeItem(CACHE_DATA_KEY);
    storage.removeItem(CACHE_CREATED_KEY);
    storage.removeItem(CACHE_VERSION_KEY);
  }

  function loadOrGenerateWeeklyForecast(
    storage,
    now = new Date(),
    random = Math.random
  ) {
    if (storage) {
      const cacheVersion = storage.getItem(CACHE_VERSION_KEY);
      const createdAt = Number.parseInt(
        storage.getItem(CACHE_CREATED_KEY) || "0",
        10
      );
      const serialized = storage.getItem(CACHE_DATA_KEY);

      if (
        cacheVersion === CACHE_VERSION &&
        serialized &&
        Number.isFinite(createdAt) &&
        now.getTime() - createdAt < WEEK_MS
      ) {
        const cached = parseForecast(serialized, now);

        if (cached) {
          return { forecast: cached, source: "cache", createdAt };
        }
      }

      //  cache remover
      clearForecastCache(storage);
    }

    const forecast = generateWeeklyForecast(now, random);
    const createdAt = now.getTime();

    if (storage) {
      storage.setItem(CACHE_DATA_KEY, serializeForecast(forecast, now));
      storage.setItem(CACHE_CREATED_KEY, String(createdAt));
      storage.setItem(CACHE_VERSION_KEY, CACHE_VERSION);
    }

    return { forecast, source: "generated", createdAt };
  }

  return Object.freeze({
    constants: Object.freeze({
      CACHE_CREATED_KEY,
      CACHE_DATA_KEY,
      CACHE_VERSION,
      CACHE_VERSION_KEY,
      DEFAULT_AUDIO_BASE_PATH,
      DAY,
      HOUR,
      MINUTE,
      NOISE_SCALE,
      STORM_END_SOUNDS,
      STORM_START_SOUNDS,
      WEATHER_EPOCH_SECONDS,
      WEEK_MS
    }),
    averageHumidity,
    averageIntensity,
    classifyCurrentWeather,
    classifyForecastDay,
    clearForecastCache,
    createSoundController,
    createWeatherSoundMonitor,
    estimateStormDurationSeconds,
    findNextStormSeconds,
    findUpcomingStorms,
    formatDuration,
    formatHumidity,
    formatIntensity,
    generateWeeklyForecast,
    loadOrGenerateWeeklyForecast,
    parseForecast,
    perlinNoise,
    sampleWeatherAtUnixSeconds,
    serializeForecast
  });
});

  </script>
  <script>
(function () {
  "use strict";

  const core = globalThis.WeatherForecastCore;
  const statusElement = document.getElementById("current-status");
  const scanElement = document.getElementById("scan-status");
  const soundStatusElement = document.getElementById("sound-status");
  const timezoneElement = document.getElementById("timezone-status");
  const stormsBody = document.getElementById("storms-body");
  const refreshButton = document.getElementById("refresh-storms");
  const toggleSoundButton = document.getElementById("toggle-sound");
  const sortStormsSelect = document.getElementById("sort-storms");

  const soundController = core.createSoundController({
    basePath: "Audios/",
    unlockTarget: document
  });
  const weatherSoundMonitor = core.createWeatherSoundMonitor({
    playInitialStorm: true,
    soundController
  });

  const localTimeZone =
    Intl.DateTimeFormat().resolvedOptions().timeZone || "Local browser time";
  const dateTimeFormatter = new Intl.DateTimeFormat(undefined, {
    weekday: "short",
    year: "numeric",
    month: "short",
    day: "numeric",
    hour: "numeric",
    minute: "2-digit",
    second: "2-digit",
    timeZoneName: "short"
  });

  let upcomingStorms = [];
  let scanInProgress = false;
  let lastSoundResult = null;

  function formatLocalTimestamp(unixSeconds) {
    if (unixSeconds === null) {
      return "Beyond scan range";
    }
    return dateTimeFormatter.format(new Date(unixSeconds * 1000));
  }

  function renderSoundStatus() {
    const state = soundController.getState();
    toggleSoundButton.textContent = state.enabled ? "Mute sound" : "Enable sound";

    if (!state.available) {
      soundStatusElement.textContent = "";
    } else if (!state.enabled) {
      soundStatusElement.textContent = "Sound is muted.";
    } else if (!state.unlocked) {
      soundStatusElement.textContent =
        "Sound is enabled. Click, tap, or press a key once to unlock playback.";
    } else if (lastSoundResult && lastSoundResult.reason === "play-failed") {
      soundStatusElement.textContent =
        "Sound is unlocked, but an audio file failed to load. Place the four .ogg files in Audios/.";
    } else {
      soundStatusElement.textContent = "Sound is enabled and unlocked.";
    }
  }

  function handlePlayback(playback) {
    if (playback && typeof playback.then === "function") {
      playback.then((result) => {
        lastSoundResult = result;
        renderSoundStatus();
      });
    }
  }

  function renderCurrentStatus() {
    const transition = weatherSoundMonitor.update();
    handlePlayback(transition.playback);

    let nextStormText = "No upcoming storm found";
    if (upcomingStorms.length > 0) {
      const remaining = Math.max(
        0,
        Math.ceil(upcomingStorms[0].startUnixSeconds - Date.now() / 1000)
      );
      nextStormText = `${formatLocalTimestamp(upcomingStorms[0].startUnixSeconds)} (${core.formatDuration(remaining)} from now)`;
    }

    statusElement.textContent =
      `Current Weather: ${transition.currentWeather} | Next Storm: ${nextStormText}`;
    renderStormRows();
    renderSoundStatus();
  }

  function renderStormRows() {
    stormsBody.replaceChildren();

    if (upcomingStorms.length === 0) {
      const row = document.createElement("tr");
      const cell = document.createElement("td");
      cell.colSpan = 5;
      cell.textContent = "No upcoming storms were found inside the seven-day scan window.";
      row.appendChild(cell);
      stormsBody.appendChild(row);
      return;
    }

    const nowSeconds = Date.now() / 1000;
    const sortedStorms = [...upcomingStorms].sort((a, b) => {
      switch (sortStormsSelect.value) {
        case "latest":
          return b.startUnixSeconds - a.startUnixSeconds;
        case "longest":
          return (b.durationSeconds ?? -1) - (a.durationSeconds ?? -1);
        case "shortest":
          return (a.durationSeconds ?? Number.POSITIVE_INFINITY) -
            (b.durationSeconds ?? Number.POSITIVE_INFINITY);
        default:
          return a.startUnixSeconds - b.startUnixSeconds;
      }
    });

    sortedStorms.forEach((storm, index) => {
      const row = document.createElement("tr");
      const countdown = Math.max(0, Math.ceil(storm.startUnixSeconds - nowSeconds));
      const values = [
        String(index + 1),
        formatLocalTimestamp(storm.startUnixSeconds),
        formatLocalTimestamp(storm.endUnixSeconds),
        storm.durationSeconds === null
          ? "Beyond scan range"
          : core.formatDuration(storm.durationSeconds),
        core.formatDuration(countdown)
      ];

      for (const value of values) {
        const cell = document.createElement("td");
        cell.textContent = value;
        row.appendChild(cell);
      }
      stormsBody.appendChild(row);
    });
  }

  function scanForUpcomingStorms() {
    if (scanInProgress) return;
    scanInProgress = true;
    scanElement.textContent = "Scanning the next seven days for storm windows…";
    refreshButton.disabled = true;

    setTimeout(function () {
      try {
        upcomingStorms = core.findUpcomingStorms(Date.now() / 1000, 720, 5);
        scanElement.textContent = upcomingStorms.length
          ? `Found ${upcomingStorms.length} upcoming storm window(s). Last scan: ${new Date().toLocaleTimeString()}.`
          : `No storms found in the next seven days. Last scan: ${new Date().toLocaleTimeString()}.`;
        renderCurrentStatus();
      } finally {
        scanInProgress = false;
        refreshButton.disabled = false;
      }
    }, 0);
  } 

  toggleSoundButton.addEventListener("click", function () {
    const state = soundController.getState();
    soundController.setEnabled(!state.enabled);
    if (state.enabled) soundController.stopAll();
    renderSoundStatus();
  });

  refreshButton.addEventListener("click", scanForUpcomingStorms);
  sortStormsSelect.addEventListener("change", renderStormRows);

  for (const eventName of ["pointerdown", "touchstart", "keydown"]) {
    document.addEventListener(eventName, () => setTimeout(renderSoundStatus, 0), {
      once: true,
      passive: true
    });
  }

  timezoneElement.textContent = `Times are shown in your browser's local timezone: ${localTimeZone}.`;
  renderCurrentStatus();
  scanForUpcomingStorms();

  setInterval(renderCurrentStatus, 1000);
  setInterval(scanForUpcomingStorms, 5 * 60 * 1000);
})();

  </script>
</body>
